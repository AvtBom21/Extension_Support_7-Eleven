<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Fill Price Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 450px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #e3f2fd 100%);
            padding: 16px;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #00897b;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 12px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #00897b;
            box-shadow: 0 0 0 3px rgba(0, 137, 123, 0.1);
        }

        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
        }

        .btn-primary {
            background: #00897b;
            color: white;
        }

        .btn-primary:hover {
            background: #00695c;
        }

        .btn-fill {
            background: #2196F3;
            color: white;
        }

        .btn-fill:hover {
            background: #1976D2;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .results {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .results h2 {
            color: #333;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 6px;
            border-left: 3px solid #00897b;
        }

        .result-region {
            font-weight: 600;
            color: #00897b;
        }

        .result-price {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }

        .result-source {
            font-size: 11px;
            color: #999;
        }

        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            color: #666;
            transition: color 0.3s;
        }

        .copy-btn:hover {
            color: #00897b;
        }

        .rules {
            background: #e0f2f1;
            padding: 12px;
            border-radius: 6px;
            margin-top: 16px;
            font-size: 12px;
        }

        .rules h3 {
            color: #00897b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .rules ul {
            list-style: none;
            padding-left: 0;
        }

        .rules li {
            padding: 4px 0;
            color: #555;
        }

        .rules li:before {
            content: "→ ";
            color: #00897b;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #323232;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 13px;
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .status {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }

        .status.success {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .status.error {
            background: #ffcdd2;
            color: #c62828;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🏷️ Auto Fill Price Tool</h1>
        <p class="subtitle">Công cụ tự động điền giá theo khu vực</p>

        <label for="upc">UPC Code (tùy chọn)</label>
        <input type="text" id="upc" placeholder="Nhập mã UPC">

        <div class="price-grid">
            <div>
                <label for="priceT6">Giá T6</label>
                <input type="number" id="priceT6" placeholder="0">
            </div>
            <div>
                <label for="priceT7">Giá T7</label>
                <input type="number" id="priceT7" placeholder="0">
            </div>
            <div>
                <label for="priceT8">Giá T8</label>
                <input type="number" id="priceT8" placeholder="0">
            </div>
            <div>
                <label for="priceT9">Giá T9</label>
                <input type="number" id="priceT9" placeholder="0">
            </div>
        </div>

        <label for="priceIntel">Giá Intel</label>
        <input type="number" id="priceIntel" placeholder="0">

        <button class="btn btn-fill" id="autoFillBtn">✨ Tự động điền vào trang</button>
        <button class="btn btn-primary" id="calculateBtn">📊 Xem kết quả</button>
        <button class="btn btn-secondary" id="resetBtn">🔄 Reset</button>

        <div id="status"></div>

        <div id="results" class="results hidden">
            <h2>Kết quả giá theo khu vực</h2>
            <div id="resultsList"></div>
        </div>

        <div class="rules">
            <h3>📋 Quy tắc ánh xạ đầy đủ</h3>
            <ul>
                <li>T6 → HCM_T4, HCM_T5, HCM_T6, HN_T5, HN_T6, BD_T5</li>
                <li>T7 → HCM_T7, HN_T7, LA, BD_T7</li>
                <li>T8 → HCM_T8, HN_T8 </li>
                <li>T9 → HCM_T9, HN_T9, HCM_Draft</li>
                <li>Intel → INTL</li>
            </ul>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>

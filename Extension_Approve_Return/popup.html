<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>RS Auto Approver</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      width: 340px;
      background: #f0f4f8;
      color: #1a202c;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
    }

    .header p {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 1px;
    }

    .body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
      display: block;
    }

    textarea {
      width: 100%;
      height: 140px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      resize: none;
      background: white;
      color: #1f2937;
      transition: border-color 0.2s;
      line-height: 1.6;
    }

    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    textarea::placeholder {
      color: #9ca3af;
    }

    .btn-run {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-run:hover { opacity: 0.9; }
    .btn-run:active { transform: scale(0.98); }
    .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-clear {
      background: white;
      color: #6b7280;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-clear:hover { background: #f9fafb; border-color: #9ca3af; }

    .result-box {
      background: white;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      display: none;
    }

    .result-box.show { display: block; }

    .result-box .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
    }

    .result-box .stat-label { color: #6b7280; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .badge-green { background: #dcfce7; color: #16a34a; }
    .badge-red   { background: #fee2e2; color: #dc2626; }
    .badge-gray  { background: #f3f4f6; color: #6b7280; }
    .badge-blue  { background: #dbeafe; color: #1d4ed8; }

    .missing-list {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #f3f4f6;
      font-size: 11px;
      color: #6b7280;
      max-height: 70px;
      overflow-y: auto;
    }

    .missing-list span {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      padding: 1px 6px;
      border-radius: 4px;
      margin: 2px 2px 0 0;
    }

    .tip {
      font-size: 11px;
      color: #6b7280;
      background: #f9fafb;
      border-radius: 6px;
      padding: 7px 10px;
      line-height: 1.5;
    }

    .tip strong { color: #374151; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">✅</div>
  <div>
    <h1>RS Auto Approver</h1>
    <p>Tự động tick checkbox theo danh sách mã</p>
  </div>
</div>

<div class="body">

  <div class="tip">
    <strong>Hướng dẫn:</strong> Mở trang danh sách Return to Supplier, dán mã RS vào ô dưới (mỗi mã một dòng), rồi nhấn <strong>Chạy</strong>.
  </div>

  <div>
    <label>📋 Danh sách mã RS</label>
    <textarea id="codeInput" placeholder="RS1120012D&#10;RS112600M0&#10;RS10260264&#10;..."></textarea>
  </div>

  <button class="btn-run" id="btnRun">
    ⚡ Chạy Auto Tick
  </button>

  <button class="btn-clear" id="btnClear">🗑 Xoá danh sách</button>

  <div class="result-box" id="resultBox">
    <div class="stat">
      <span class="stat-label">Tổng mã trong danh sách</span>
      <span class="badge badge-blue" id="statTotal">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Đã tick thành công</span>
      <span class="badge badge-green" id="statOk">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Đã tick rồi (bỏ qua)</span>
      <span class="badge badge-gray" id="statSkip">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Không tìm thấy trên trang</span>
      <span class="badge badge-red" id="statMiss">0</span>
    </div>
    <div class="missing-list" id="missingList"></div>
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>

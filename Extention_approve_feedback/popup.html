<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h3 {
      margin: 0 0 15px 0;
      color: #008061;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      background: #008061;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover {
      background: #006b52;
    }
    button.uncheck {
      background: #dc3545;
    }
    button.uncheck:hover {
      background: #c82333;
    }
    #status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      display: none;
    }
    #status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    #status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h3>🎯 7-Eleven Auto Checker</h3>
  
  <button id="checkAll">
    ✓ Tick tất cả checkbox
  </button>
  
  <button id="uncheckAll" class="uncheck">
    ✗ Bỏ tick tất cả
  </button>
  
  <div id="status"></div>
  
  <div class="info">
    💡 Extension này sẽ tự động tick/bỏ tick các checkbox trong phần "Refill suggestion list"
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
